# Docker Compose para dev local — NO se usa en producción.
# En prod, MySQL corre en Hostinger (ver docs/deployment.md).
#
# Servicios:
#   mysql    — la base de datos de la app (puerto 3306 en el host)
#   adminer  — UI web para inspeccionar tablas (puerto 8080 → http://localhost:8080)
#
# Datos persisten en el volumen `kairo-mysql-data`. Para empezar de cero:
#   docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: kairo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev-root-password
      MYSQL_DATABASE: kairo
      MYSQL_USER: kairo
      MYSQL_PASSWORD: kairo-dev
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - kairo-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pdev-root-password",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: kairo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  kairo-mysql-data:
    name: kairo-mysql-data
